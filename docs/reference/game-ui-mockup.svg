<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="100%" height="100%" style="background-color: #0f172a; font-family: monospace, sans-serif;">
  <style>
    .title { fill: #f8fafc; font-size: 20px; font-weight: bold; }
    .subtitle { fill: #38bdf8; font-size: 14px; }
    .box { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 6px; }
    .button { fill: #0284c7; stroke: #38bdf8; stroke-width: 1.5; rx: 4px; }
    .button-text { fill: #ffffff; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .text { fill: #94a3b8; font-size: 12px; }
    .text-white { fill: #f8fafc; font-size: 12px; }
    .code { fill: #4ade80; font-size: 13px; }
    .accent { fill: #f59e0b; font-size: 12px; }
  </style>

  <!-- SCREEN 1: MAIN MENU -->
  <g transform="translate(50, 40)">
    <rect class="box" x="0" y="0" width="1100" height="360" />
    <text x="550" y="50" class="title" text-anchor="middle">CHRONICLES OF DEVLANDIA</text>
    <text x="550" y="75" class="subtitle" text-anchor="middle">"Solve the Map, Break the Code, Find the Treasure."</text>
    <rect class="button" x="450" y="110" width="200" height="35" />
    <text x="550" y="132" class="button-text">SOLO QUEST</text>
    <rect class="button" x="450" y="155" width="200" height="35" />
    <text x="550" y="177" class="button-text">TEAM LOBBY</text>
    <rect class="button" x="450" y="200" width="200" height="35" />
    <text x="550" y="222" class="button-text">SETTINGS</text>
    <rect class="button" x="450" y="245" width="200" height="35" fill="#ef4444" stroke="#f87171" />
    <text x="550" y="267" class="button-text">EXIT GAME</text>
    <text x="20" y="335" class="text">[?] HCI Help / Tutorials</text>
    <text x="1080" y="335" class="text" text-anchor="end">v1.0 | Offline Network</text>
  </g>

  <!-- SCREEN 2: OVERWORLD -->
  <g transform="translate(50, 440)">
    <rect class="box" x="0" y="0" width="1100" height="420" />
    <rect x="0" y="0" width="1100" height="40" fill="#0f172a" stroke="#334155" />
    <text x="20" y="25" class="accent">[HP: |||||] [STAMINA: |||||]</text>
    <text x="550" y="25" class="title" font-size="14" text-anchor="middle">REGION: C++ PEAKS (SNOW)</text>
    <text x="1080" y="25" class="text" text-anchor="end">[19:29] [=]</text>
    <rect class="box" x="20" y="60" width="120" height="100" />
    <text x="80" y="80" class="text" text-anchor="middle">[MINI-MAP]</text>
    <circle cx="80" cy="110" r="4" fill="#38bdf8" />
    <text x="300" y="100" class="text">(SNOWY PEAKS BIOME)</text>
    <text x="300" y="140" class="accent">[Treasure Chest #1] (X)</text>
    <path d="M 200 200 L 900 200" stroke="#0284c7" stroke-width="8" stroke-dasharray="10 5" />
    <text x="550" y="190" class="text" text-anchor="middle">(Frozen River)</text>
    <rect class="button" x="500" y="210" width="100" height="30" fill="#f59e0b" stroke="#fbbf24" />
    <text x="550" y="230" class="button-text">[G] GATE</text>
    <circle cx="400" cy="280" r="10" fill="#22c55e" />
    <text x="420" y="285" class="text-white">[PLAYER]</text>
    <circle cx="450" cy="270" r="6" fill="#38bdf8" />
    <text x="465" y="275" class="subtitle">[AI DRONE]</text>
    <text x="700" y="320" class="text">(DENSE FORESTS BIOME)</text>
    <rect x="0" y="370" width="1100" height="50" fill="#0f172a" stroke="#334155" />
    <text x="20" y="400" class="text-white">[INVENTORY: [Key] [Food] [ ] [ ]]</text>
    <text x="1080" y="400" class="accent" text-anchor="end">[QUEST: Reach Java Island (0/1)]</text>
  </g>

  <!-- SCREEN 3: TERMINAL PUZZLE -->
  <g transform="translate(50, 900)">
    <rect class="box" x="0" y="0" width="1100" height="390" stroke="#f59e0b" stroke-width="2" />
    <rect x="0" y="0" width="1100" height="40" fill="#f59e0b" />
    <text x="20" y="25" class="button-text" font-size="15" fill="#0f172a">&lt; TERMINAL GATE LOCK: C++ PEAKS &gt;</text>
    <text x="1080" y="25" class="button-text" font-size="15" fill="#0f172a" text-anchor="end">[X] CLOSE</text>
    <text x="20" y="70" class="text-white">PUZZLE INSTRUCTIONS:</text>
    <text x="20" y="90" class="text">Fix the CSS styling property below to reveal the missing bridge path.</text>
    <rect class="box" x="20" y="110" width="1060" height="140" fill="#090d16" />
    <text x="40" y="140" class="code">1 | .frozen-bridge {</text>
    <text x="40" y="165" class="code">2 |     width: 100%;</text>
    <text x="40" y="190" class="code">3 |     display: <tspan fill="#f59e0b">[  none  ]</tspan>;  &lt;-- TYPE CORRECT VALUE HERE</text>
    <text x="40" y="215" class="code">4 | }</text>
    <rect class="box" x="20" y="270" width="600" height="90" stroke="#38bdf8" />
    <text x="40" y="295" class="subtitle">SMART AI DRONE DIAGNOSTIC HINT:</text>
    <text x="40" y="320" class="text-white">"Setting display to 'none' hides the object. Try 'block' instead!"</text>
    <rect class="button" x="700" y="270" width="380" height="40" fill="#22c55e" stroke="#4ade80" />
    <text x="890" y="295" class="button-text">[ SUBMIT CODE ]</text>
    <rect class="button" x="700" y="320" width="380" height="40" fill="#64748b" stroke="#94a3b8" />
    <text x="890" y="345" class="button-text">[ USE HINT ITEM ]</text>
  </g>
</svg>
